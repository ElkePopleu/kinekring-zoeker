ngevuld"}, {"Naam praktijk": "Kinergiek", "Gemeente": "Hasselt", "Specialisaties": [], "Adres": "Anne Frankplein 13, Hasselt, België", "Over de praktijk": "Kinergiek is een groepspraktijk van kinesitherapeuten in Hasselt. In onze praktijken in de Lazarijstraat en op het Anne Frankplein kan u bij een van onze 11 therapeuten terecht voor algemene kinesitherapie maar ook voor meer gespecialiseerde behandelings- problematiek.\n\n \n\nAnne Frankplein 13, 3500 Hasselt\n\nLazarijstraat 20, 3500 Hasselt", "Betaalwijze": "Accepteert cash | Accepteert contactloos betalen | Accepteert Payconiq", "Voorzieningen": "Rolstoeltoegankelijk", "Verantwoordelijke persoon": "Robbert Bogaerts", "Over de kinesist": "", "Telefoon kinesist": "011943689", "E-mail": "info@kinergiek.be", "Telefoonnummer praktijk": "", "Website": "https://www.kinergiek.be", "Geconventioneerd of gedeconventioneerd": "", "Huisbezoeken": "Huisbezoeken", "Openingsuren": "Maandag: 08:00–20:00\nDinsdag: 08:00–20:00\nWoensdag: 08:00–20:00\nDonderdag: 08:00–20:00\nVrijdag: 08:00–18:00\nZaterdag: Gesloten\nZondag: Gesloten"}, {"Naam praktijk": "Gezondheidspraktijk PERSPECTIEF", "Gemeente": "Hasselt", "Specialisaties": [], "Adres": "Kanaalstraat 48, 3511 Hasselt, België", "Over de praktijk": "Ons gezondheidsteam - bestaande uit kinesitherapeuten, osteopaten, en andere gezondheidsmedewerkers - is gedreven om jou een Gezond Perspectief te bieden. Wat ons drijft is om inzicht te geven in jouw gezondheidsvraag en hierbij zowel letterlijk als figuurlijk een helpende hand te zijn. Kinesitherapie en Osteopathie zijn en blijven de kernexpertise van ons team. Daarnaast werken we actief samen met een team van gezondheidsexperten om diepere oorzaken aan te pakken in voeding , levensstijl , mentaal en emotioneel welbevinden . Je kan bij ons m.a.w. terecht voor alle fysieke klachten, waaronder gewrichts- en wervelkolomproblemen ( manuele therapie ), sportblessures ( sportkinesitherapie ), post-operatieve revalidaties en spier- en peesgerelateerde aandoeningen ( dry needling ). Maar ook voor klachten zoals hoofdpijn, migraine, spijsverterings- en andere abdominale klachten, energiegebrek, slaapproblemen, emotionele disbalans of huidproblemen. Als lerend netwerk van experten zijn we gedreven in het zoeken naar de oorzaak . Wij willen verduidelijken, informeren en kennis doorgeven om jou opnieuw perspectief te geven.", "Betaalwijze": "", "Voorzieningen": "", "Verantwoordelijke persoon": "Wouter Foets", "Over de kinesist": "Wouter is binnen gezondheidspraktijk “perspectief” hoofdkinesitherapeut, en legt zich voornamelijk toe op (sport-)blessures, rug- en nekklachten \u0026 postoperatieve revalidaties. Hiervoor kan hij beroep doen op zijn brede waaier aan competenties, waaronder sportkinesitherapie, manuele therapie en dry needling. Verder combineert hij zijn behandelingen vaak met orthomoleculair advies om zodoende het herstel optimaal te bevorderen.", "Telefoon kinesist": "0470/47 43 52", "E-mail": "info@gezondperspectief.be", "Telefoonnummer praktijk": "", "Website": "https://www.gezondperspectief.be/", "Geconventioneerd of gedeconventioneerd": "", "Huisbezoeken": "Huisbezoeken", "Openingsuren": "Maandag: 08:00–22:00\nDinsdag: 08:00–22:00\nWoensdag: 08:00–22:00\nDonderdag: 08:00–22:00\nVrijdag: 08:00–22:00\nZaterdag: Uren niet ingevuld\nZondag: Uren niet ingevuld"}, {"Naam praktijk": "Kinepraktijk Jeroen Motmans", "Gemeente": "Hasselt", "Specialisaties": [], "Adres": "Hommelheidestraat 52, Hasselt, België", "Over de praktijk": "Kinepraktijk in Kuringen (Hasselt) voor: Algemene Kinesitherapie Sportkinesitherapie Manuele therapie Postoperatieve revalidatie Blessurepreventie + screening Dry needling Kaakproblemen Handtherapie NST", "Betaalwijze": "Accepteert Payconiq", "Voorzieningen": "Rolstoeltoegankelijk", "Verantwoordelijke persoon": "Jeroen Motmans", "Over de kinesist": "", "Telefoon kinesist": "0496365552", "E-mail": "info@jeroenmotmans.be", "Telefoonnummer praktijk": "", "Website": "https://www.jeroenmotmans.be", "Geconventioneerd of gedeconventioneerd": "", "Huisbezoeken": "Huisbezoeken", "Openingsuren": "Maandag: 07:30–22:00\nDinsdag: 07:30–22:00\nWoensdag: 07:30–22:00\nDonderdag: 07:30–22:00\nVrijdag: 07:30–22:00\nZaterdag: Op afspraak\nZondag: Op afspraak"}, {"Naam praktijk": "Vanstraelen kinesitherapie \u0026amp; osteopathie", "Gemeente": "Alken", "Specialisaties": [], "Adres": "Hoveniersstraat 2a, 3570 Alken, België", "Over de praktijk": "We behandelen alle klachten die te maken hebben met het algemeen locomotorisch systeem. We begeleiden patiënten na operaties aan nek, rug en ledematen, pees- en spierletsels na (sport)ongeval of trauma. We behandelen tevens alles wat te maken heeft in de periode voor en na de bevalling. Ook de chronische pijnpatiënten zoals fibromyalgie en CVS kunnen bij ons terecht om via graded exposure excercise een betere uitgaanspositie te bekomen.\n\nDaarnaast zijn de neurologische pathologieën ook welkom, zoals bijv. Parkinson, spierziekten, CVA,...\n\n \n\nOns team kent een divers arsenaal aan technieken, waardoor er steeds een geschikte therapeut voor onze patiënten voorhanden is.\n\nWe werken 1 op 1 met onze patiënt en geven voldoende handvaten mee om thuis verder aan de revalidatie te werken. Dit alles doen we met de nodige zorg voor de persoon als geheel, met een holistische visie, omdat geest en lichaam onlosmakelijk met elkaar verbonden zijn. Kortom, je voelt je hier als patiënt begrepen, gehoord, gesteund...met andere woorden...Welkom!", "Betaalwijze": "", "Voorzieningen": "Rolstoeltoegankelijk", "Verantwoordelijke persoon": "Kim Vanstraelen", "Over de kinesist": "osteopaat", "Telefoon kinesist": "0474617302", "E-mail": "info@kine-vanstraelen.be", "Telefoonnummer praktijk": "", "Website": "", "Geconventioneerd of gedeconventioneerd": "", "Huisbezoeken": "Huisbezoeken", "Openingsuren": "Maandag: Op afspraak\nDinsdag: Uren niet ingevuld\nWoensdag: Uren niet ingevuld\nDonderdag: Uren niet ingevuld\nVrijdag: Uren niet ingevuld\nZaterdag: Uren niet ingevuld\nZondag: Uren niet ingevuld"}, {"Naam praktijk": "Kinesa Hasselt", "Gemeente": "Hasselt", "Specialisaties": [], "Adres": "Luikersteenweg 232, Hasselt, België", "Over de praktijk": "groepspraktijk van 4 kinesisten met ieder zijn of haar specialiteit: bekkenbodem kine, sport- en orthopedische revalidatie, psychomotorische revalidatie, temporomandibulaire dysfuncties , manuele therapie en perinatale kinesitherapie.\n\nInfo sessies in samenwerking met vroedvrouw rond arbeid en bevalling en de opgroeiende baby.", "Betaalwijze": "", "Voorzieningen": "", "Verantwoordelijke persoon": "Ine Witters", "Over de kinesist": "", "Telefoon kinesist": "", "E-mail": "", "Telefoonnummer praktijk": "", "Website": "https://www.kinesahasselt.be", "Geconventioneerd of gedeconventioneerd": "", "Huisbezoeken": "Huisbezoeken", "Openingsuren": "Maandag: Op afspraak\nDinsdag: Op afspraak\nWoensdag: Op afspraak\nDonderdag: Op afspraak\nVrijdag: Op afspraak\nZaterdag: Gesloten\nZondag: Gesloten"}, {"Naam praktijk": "Basteijns Wim", "Gemeente": "Hasselt", "Specialisaties": ["Algemene kinesitherapie", "Hoofdpijnklachten", "Kaakproblemen", "Manuele Therapie", "Oedeemtherapie\u003eMethode van Leduc", "Sportkinesitherapie"], "Adres": "Overdemerstraat 79, Hasselt, België", "Over de praktijk": "Ondertussen meer dan 17 jaar werkzaam als manueel therapeut/sportkinesitherapeut en ook bezig met andere interesses zoals o.a. kaakgewrichten en lymfedrainage. Daarnaast ben ik graag met sport bezig (lopen, fietsen, mountainbike, fitness) en spendeer ik graag tijd met mijn gezin.", "Betaalwijze": "", "Voorzieningen": "", "Verantwoordelijke persoon": "", "Over de kinesist": "", "Telefoon kinesist": "", "E-mail": "wim_basteijns@hotmail.com", "Telefoonnummer praktijk": "474374392", "Website": "https://kinepraktijkoverdemer.be/", "Geconventioneerd of gedeconventioneerd": "Geconventioneerd", "Huisbezoeken": "Huisbezoeken", "Openingsuren": ""}, {"Naam praktijk": "CURACTIVE", "Gemeente": "Kuringen Hasselt", "Specialisaties": [], "Adres": "Annie M.G. Schmidtstraat 1, Kuringen Hasselt, België", "Over de praktijk": "CURACTIVE te Kuringen is een dynamische praktijk bestaande uit een team van twee kinesitherapeuten en een diëtiste. Wij zijn thuis in sport, orthopedische en neurologische revalidaties en begeleiden ook chronische pijnpatiënten of mensen met ME \u0026 CVS. In een 1 op 1 setting werken wij manueel therapeutisch en hebben hierin een bijzondere beroepsbekwaamheid (Mathera). We behandelen specifiek ook patiënten met (g)lymfatische en orofasciale klachten en doen aan brandwonden- \u0026 littekentherapie reeds in vroege fase na plaatsing van de huidgreffen. We werken hiervoor samen met de verschillende brandwondencentra in België \u0026 doen wondzorgmanagement met het 'Wondzorgcentrum'. We benaderen de patiënt steeds vanuit een holistisch karakter en kunnen, wanneer zinvol, gebruik maken van een arsenaal complementaire therapiën.", "Betaalwijze": "Accepteert Payconiq", "Voorzieningen": "Rolstoeltoegankelijk | Wifi aanwezig", "Verantwoordelijke persoon": "Mario Dirix", "Over de kinesist": "In 2001 studeerde Mario Dirix af als kinesitherapeut (aan het huidige UHasselt) waarna hij onmiddellijk startte in de praktijk van Prof. Dr. Meesen Raf die hij tijdens zijn opleiding ontmoette en voor hem een mentor werd de daarop volgende jaren. Daar leerde hij het geven van individuele behandelingen op maat van de patiënt. Hij leerde er tevens de skills voor musculoskeletale en sportspecifieke klachten zoals pijn of stijfheid in rug en nek, knie- en achillespeesontstekingen, golfers- en tennisellebogen, kruisbandletsels, scheenbeenvliesontstekingen, enkeldistorsies, frozen shoulders, pols- en handletsels. Maar ook het begeleiden van mensen na een orthopedische ingreep zoals, achillespeesruptuur, knie- en heupprothese plaatsing, schouderoperaties van het type Bankart of PASTA letsel. Door de opleiding Medische Trainingstherapie van de Katholieke Hogeschool Brussel (2002), verstevigde hij dan ook zijn kunde. Raf en Mario waren pioniers door in hun behandelingen regelmatig gebruik te maken van de Noorse methode Terapi Master wat pas later populair zou worden onder de naam Redcord, of Sling Exercise Therapy. Ondertussen stilde hij zijn honger naar kennis en zijn toenemende interesse om de patiënt in totaliteit te gaan behandelen. Daarom volgde hij o.a. de opleiding Myofasciale Therapie = Advanced Dry Needling bij Jing Ming / BMST / Trigger te Brugge (2003). Hiermee maakte hij het mogelijk om patiënten met verkrampte en overbelaste spieren, RSI klachten, hoofdpijn, kaakgewrichtsproblemen, whiplash of contracturen nog beter te behandelen. Professional Applied Kinesiology (2005) gaf hem de tool om functionele stoornissen te begrijpen en een waardevol inzicht te geven in het totale fysiologisch functioneren van de patiënt en dit enkel door kortgerichte druk op structuren, een orale stimulatie, testing van een ademhalingsfase of vingercontact op de plaats van het probleem. De opleiding Structurele Osteopathie, IAO Gent (2006), verscherpte zijn manipulaties en soft tissue technieken dewelke nodig zijn bij het losmaken van verklevingen van de fascia en blokkades in het bekken, de lumbale, thoracale of cervicale regio. Hierdoor kunnen problemen zoals lage rugpijn, hernia, ischias, spit, bekkeninstabiliteit nog beter aangepakt worden. Van Michael Nixon Livy leerde hij uit eerste hand de Neuro Structurele Integratie Technique (NST, 2007) ook gekend als the Advanced Bowen Technique om spieren en fascia te ontspannen en hierdoor de structurele integriteit van het lichaam te herstellen met een verlichting van pijn en dysfunctie en met homeostasis tot gevolg. Al die ervaringsuitbreiding zorgde er voor dat hij als externe medewerker werkte in de praktijken Benats te Bilzen, Simonis te Gingelom, en Graindourze te Heers. In 2007 liep Mario de begeleider van zijn thesis, Jos Sneyers, terug tegen het lijf. Ze werkten in 2001 samen aan een paper over ‘De effecten van Kinesio Taping op de proprioceptie van het kniegewricht’, wat op dat moment baanbrekend was. Maar nu vroeg Jos hem om zijn team te gaan versterken vanuit zijn ondertussen stevig opgebouwde expertise. Wat uitgroeide tot een multidisciplinair sport – en gezondheidscentrum met een dynamiek om de mens vanuit verschillende specialismen te behandelen en niet alleen het letsel. Hier kwamen alle reeds aangeleerde tools volledig tot zijn recht, maar de zoektocht naar meer was zeker nog niet ten einde! Mede onder invloed van de sportdisciplines waardoor hij omgeven was, groeide zijn interesse voor voeding, orthomoleculaire geneeskunde, emotioneel werk en natuurlijk ook voor blessure preventie en screening! Dit zorgde weer voor het bijwonen van tal van bijscholingen, congressen en opleidingen, zoals het Limburgs Congres voor Sportgeneeskunde of het International Symposium on Nutrition \u0026 Natural Therapy in Vietnam. Hieruit ontsproot onder leiding van Dr. Marc Elsen de zin om patiënten voedingsadvies te geven volgens het principe van de Polariteitsgeneeskunde. In Nederland leerde Mario een testbatterij kennen, namelijk Functional Movement Screen (2008) waardoor hij via een aantal testbewegingen de zwakke schakel(s) kon zoeken. Bijgevolg worden de probleemgebieden van de persoon in kaart gebracht, met het opstellen van een aangepast oefenschema tot gevolg. Hierdoor zullen de zwakke schakels ‘sterker’ worden en revalideert de patiënt kwalitatief veel beter en kan de sporter blessures voorblijven (preventie) en gaat het rendement van zijn sportspecifieke training verhogen. Gedurende de samenwerking bij Active Live, behandelde hij menige patiënten die tennissen, turnen, volleybal, of golf spelen maar ook voetballers van verschillende divisies. Heel wat spelers van KVC Westerlo revalideerden regelmatig onder zijn toeziend oog. Ze gingen zelfs ‘s ochtends met hem mee naar het zwembad, om in vroege fase van hun revalidatie al aan aquatraining te doen. Later ging hij ook race piloten begeleiden gedurende de 24 Uren van Zolder en Spa – Francorchamps.", "Telefoon kinesist": "'+3211252190", "E-mail": "curactive@skynet.be", "Telefoonnummer praktijk": "", "Website": "https://curactive-hasselt.be", "Geconventioneerd of gedeconventioneerd": "", "Huisbezoeken": "Geen huisbezoeken", "Openingsuren": "Maandag: 07:30–21:00\nDinsdag: 07:30–21:00\nWoensdag: 07:30–20:00\nDonderdag: 07:30–21:00\nVrijdag: 07:30–20:00\nZaterdag: Op afspraak\nZondag: Gesloten"}, {"Naam praktijk": "Qure", "Gemeente": "Hasselt", "Specialisaties": [], "Adres": "Europalaan 1, 3500 Hasselt, België", "Over de praktijk": "Qure is ontstaan uit het idee dat symptomen niet altijd het hele verhaal vertellen.\n\nMet een kritische, wetenschappelijke kijk gaan we samen op zoek naar de oorzaak van jouw probleem. Brede kijk naar het lichaam Warme omgeving Wetenschappelijk \u0026 up-to-date Wij maken graag tijd voor u", "Betaalwijze": "", "Voorzieningen": "", "Verantwoordelijke persoon": "Michiel Quetin", "Over de kinesist": "Als kinesist werk ik voornamelijk met manuele therapie, dryneedling en oefentherapie. Verder werk ik ook als klinisch psycho-neuro-immunoloog en ga op zoek naar de oorzaak van de klachten.", "Telefoon kinesist": "0493 46 04 06", "E-mail": "info@qure.be", "Telefoonnummer praktijk": "", "Website": "https://www.qure.be/", "Geconventioneerd of gedeconventioneerd": "", "Huisbezoeken": "Huisbezoeken", "Openingsuren": "Maandag: 08:00–20:00\nDinsdag: 08:00–20:00\nWoensdag: 08:00–18:00\nDonderdag: 08:00–20:00\nVrijdag: 08:00–18:00\nZaterdag: Uren niet ingevuld\nZondag: Uren niet ingevuld"}, {"Naam praktijk": "FYSIOPLUS Hasselt", "Gemeente": "Hasselt", "Specialisaties": [], "Adres": "Oude Kuringerbaan 41, Hasselt, België", "Over de praktijk": "Jonge dynamische groepspraktijk in Hasselt centrum\n\n- Manuele therapie\n\n- Individuele en groepsrevalidatie\n\n- NST\n\n- FKC\n\n- Orthomoleculaire therapie\n\n- Dry needling\n\n-Medical taping incl. Lymfe\n\
